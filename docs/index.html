<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Репетитор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: школьная тетрадь в клетку — лист с красной полосой полей, проверка «красной ручкой учителя». */
:root{
  --paper:#F7F9FC; --grid:#E2E9F4; --margin:#EFB3AE;
  --card:#FFFFFF; --ink:#1D2842; --muted:#5B6782; --line:#D6DDE9;
  --accent:#2756C0; --accent-soft:#E5ECFA;
  --pen:#C4362C; --pen-soft:#FBE8E5;
  --ok:#2C8650; --ok-soft:#E3F3E9;
  --warn:#A86E12; --warn-soft:#FAF0DC;
  --kid0:#2756C0; --kid1:#0E7C78;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131A26; --grid:#1D2636; --margin:#55302F;
  --card:#1A2232; --ink:#E6EBF4; --muted:#9BA7BE; --line:#2C3649;
  --accent:#86A7F2; --accent-soft:#222F4B;
  --pen:#F2857A; --pen-soft:#3A2325;
  --ok:#62C690; --ok-soft:#1C3428;
  --warn:#E5B653; --warn-soft:#382D17;
  --kid0:#86A7F2; --kid1:#52C7C0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131A26; --grid:#1D2636; --margin:#55302F;
  --card:#1A2232; --ink:#E6EBF4; --muted:#9BA7BE; --line:#2C3649;
  --accent:#86A7F2; --accent-soft:#222F4B;
  --pen:#F2857A; --pen-soft:#3A2325;
  --ok:#62C690; --ok-soft:#1C3428;
  --warn:#E5B653; --warn-soft:#382D17;
  --kid0:#86A7F2; --kid1:#52C7C0; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:12px 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:1.55rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
@media (max-width:480px){.tab{padding:7px 11px;font-size:.84rem}.brand{font-size:.95rem}}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.brand .dot{width:12px;height:12px;border-radius:3px;background:var(--pen);transform:rotate(45deg)}
.nav{margin-left:auto;display:flex;gap:6px}
.tab{white-space:nowrap;font:600 .92rem var(--f-body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* buttons */
.btn{font:600 1rem var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.pen{background:var(--pen);border-color:var(--pen);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible,.kid:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}

/* sheet = тетрадный лист */
.sheet{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px 20px 34px;box-shadow:0 1px 0 var(--line)}
.sheet::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:2px;background:var(--margin)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 .78rem var(--f-body);letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.pen{background:var(--pen-soft);color:var(--pen)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.gray{background:transparent;color:var(--muted);border:1px solid var(--line)}
.hand{font-family:var(--f-hand);font-weight:700;color:var(--pen);font-size:1.6rem;line-height:1.1}
.hand.ok{color:var(--ok)}

/* home */
.hero{padding-block:22px 6px}
.hero p{max-width:60ch;margin-top:8px}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:18px}
.kid{text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;color:var(--ink);font:inherit;border-top:6px solid var(--kc,var(--accent))}
.kid .name{font-family:var(--f-display);font-weight:600;font-size:1.25rem}
.kid .stats{display:flex;gap:16px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.howto{margin-top:18px}
.howto ol{margin:8px 0 0;padding-left:20px}

/* test list */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.item>div{min-width:0}
.item .t{font-weight:600;font-size:1.05rem}
.section-h{margin:22px 0 10px;font-family:var(--f-body);font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:520px){.item{grid-template-columns:1fr}.item .btn{width:100%}}

/* runner */
.progress{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:1.12rem;line-height:1.6}
.qtext mark{background:var(--warn-soft);color:inherit;padding:0 3px;border-radius:3px}
.vis{margin:14px 0;overflow-x:auto}
.vis svg{display:block;width:100%;height:auto;max-height:380px;color:var(--ink)}
.jxgbox{width:100%;max-width:520px;max-height:420px;margin:0 auto;border:1px solid var(--line);border-radius:8px;background:var(--card);position:relative;overflow:hidden}
.jxgbox .JXGtext{font-family:var(--f-body)!important}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt .let{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .let{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft)} .opt.wrong .let{background:var(--pen);color:#fff}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.numrow input{font:600 1.2rem var(--f-body);width:min(240px,100%);min-height:52px;padding:8px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.unit{font-weight:600;color:var(--muted)}
.hintbox{margin-top:12px;padding:12px 14px;border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:6px}
.verdict{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:10px;margin-top:16px}
.verdict.ok{background:var(--ok-soft)} .verdict.bad{background:var(--pen-soft)}
.why{margin-top:12px;padding:12px 14px;border:2px dashed var(--pen);border-radius:10px}
.why .lbl{font-weight:700;color:var(--pen);font-size:.86rem;letter-spacing:.04em;text-transform:uppercase}
.solution{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;border:2px solid var(--accent);color:var(--accent)}
.steps li>div{min-width:0}
.lesson{margin-top:14px;padding:16px;border-radius:10px;background:var(--accent-soft)}
.lesson h3{color:var(--accent)}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:18px}
.score{font-family:var(--f-display);font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.res-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.res-list div{display:flex;gap:10px;align-items:flex-start}
.mark{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:.9rem}
.mark.ok{background:var(--ok)} .mark.bad{background:var(--pen)} .mark.study{background:var(--warn)}
.photo{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.photo img{max-height:220px;border-radius:8px;margin-top:10px;border:1px solid var(--line)}
.ai{margin-top:10px;white-space:pre-wrap}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}

/* parent */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bar{display:inline-block;width:70px;height:7px;border-radius:999px;background:var(--line);vertical-align:middle;margin-right:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.namefield{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.namefield input{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:44px;width:min(260px,100%)}
.banner{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:.95rem}
.sendres textarea{width:100%;min-height:90px;margin-top:8px;font:13px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:10px;max-width:calc(100% - 32px);z-index:20;font-weight:500}
.empty{text-align:left;padding:22px}
code.tex{font-family:ui-monospace,Menlo,monospace;font-size:.92em;background:var(--accent-soft);padding:0 4px;border-radius:4px}
math{font-size:1.1em}
.opt math{font-size:1.25em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap">
  <button class="brand" id="brand" type="button"><span class="dot" aria-hidden="true"></span>Репетитор</button>
  <nav class="nav" aria-label="Разделы">
    <button class="tab" id="tabKids" type="button">Ученики</button>
    <button class="tab" id="tabParent" type="button">Для родителя</button>
  </nav>
</div></header>
<div class="wrap" id="localBanner" hidden><div class="banner"><b>Ответы сохраняются на этом устройстве.</b> В конце теста нажми «Поделиться» или «WhatsApp» — результат уйдёт родителю, и он добавит его в статистику.</div></div>
<main class="wrap" id="view">
  <section class="hero">
    <h1>Тесты по школьной программе</h1>
    <p class="muted">Загружаю тесты…</p>
  </section>
</main>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsxgraph/1.12.2/jsxgraphcore.js"></script>
<style>.share-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.share-row .btn{text-decoration:none}</style>

<script>
/* ===== static mode (GitHub Pages): база данных заменена JSON-файлами ===== */
(function(){
  const DATA = "data/";
  let index = null, cache = {};
  async function loadIndex(){
    if(index) return index;
    const r = await fetch(DATA + "index.json", {cache:"no-cache"});
    if(!r.ok) throw new Error("index.json " + r.status);
    index = await r.json(); return index;
  }
  async function loadQuestions(testId){
    if(cache[testId]) return cache[testId];
    const r = await fetch(DATA + "tests/" + encodeURIComponent(testId) + ".json", {cache:"no-cache"});
    if(!r.ok) throw new Error("questions " + r.status);
    const d = await r.json(); cache[testId] = d.questions || []; return cache[testId];
  }
  const snapDoc = (exists, data) => ({exists, data: () => data});
  const snapQuery = rows => ({docs: rows.map(x => ({id: x.id, data: () => { const {id, ...b} = x; return b; }}))});
  const readOnly = () => Promise.reject({code: "invalid_argument", message: "static site"});
  function db(){
    return {
      doc(path){
        return {
          onSnapshot(cb, err){ loadIndex().then(ix => {
              if(path === "config/main") cb(snapDoc(true, {kids: ix.kids}));
              else cb(snapDoc(false, null));
            }).catch(err || console.warn); },
          get(){ return loadIndex().then(ix => path === "config/main" ? snapDoc(true, {kids: ix.kids}) : snapDoc(false, null)); },
          set: readOnly, update: readOnly
        };
      },
      collection(path){
        const m = /^tests\/([^/]+)\/questions$/.exec(path);
        const fetchRows = async () => {
          if(path === "tests") return (await loadIndex()).tests;
          if(path === "attempts") return [];
          if(m) return (await loadQuestions(decodeURIComponent(m[1]))).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
          return [];
        };
        const q = {
          get: () => fetchRows().then(snapQuery),
          orderBy(){ return q; },
          onSnapshot(cb, err){ fetchRows().then(r => cb(snapQuery(r))).catch(err || console.warn); },
          doc(){ return {id: "loc-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8)}; }
        };
        return q;
      }
    };
  }
  window.claude = {
    use(name){
      if(name === "db") return Promise.resolve(db());
      if(name === "user") return Promise.resolve({can: async () => false});
      return Promise.resolve(null);
    }
  };
  /* прямая ссылка: ?kid=k8  или  ?kid=k8&test=<id> */
  window.addEventListener("load", () => {
    const p = new URLSearchParams(location.search);
    const kid = p.get("kid"), test = p.get("test");
    if(!kid) return;
    let n = 0;
    const tick = () => {
      if(typeof S === "undefined" || !S.ready || !S.kids.some(k => k.id === kid)){ if(n++ < 60) setTimeout(tick, 150); return; }
      const t = test && S.tests.find(x => x.id === test);
      if(t && typeof startTest === "function") startTest(kid, t);
      else if(typeof go === "function") go({name: "kid", kid});
    };
    tick();
  });
})();
</script>
<script>
"use strict";
/* ============ state ============ */
const DEFAULT_KIDS=[{id:"k5",name:"Ученик 5 класса",grade:5},{id:"k8",name:"Ученик 8 класса",grade:8}];
const S={db:null,sample:null,canImages:false,ready:false,kids:DEFAULT_KIDS.slice(),tests:[],attempts:[],dbAttempts:[],route:{name:"home"},run:null,local:false};
const $view=document.getElementById("view");

/* ============ helpers ============ */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inl(s){return s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/==(.+?)==/g,"<mark>$1</mark>").replace(/\n/g,"<br>");}
function rich(str){
  return String(str??"").split(/(\$[^$\n]+\$)/g).map(p=>{
    if(p.length>2&&p[0]==="$"&&p[p.length-1]==="$"){
      const tex=p.slice(1,-1);
      if(typeof katex!=="undefined"){try{return katex.renderToString("\\displaystyle "+tex,{output:"mathml",throwOnError:false});}catch(e){}}
      return '<code class="tex">'+esc(tex)+"</code>";
    }
    return inl(esc(p));
  }).join("");
}
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k==="html")el.innerHTML=v; else if(k==="text")el.textContent=v;
    else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else if(k==="class")el.className=v; else el.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)));}
  return el;
}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let toastT;function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4200);}
const fmtDate=iso=>{try{return new Date(iso).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});}catch(e){return "";}};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const kidById=id=>S.kids.find(k=>k.id===id)||{id,name:"Ученик",grade:""};
const kidColor=id=>`var(--kid${Math.max(0,S.kids.findIndex(k=>k.id===id))%2})`;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function plural(n,a,b,c){const m=n%10,mm=n%100;return m===1&&mm!==11?a:(m>=2&&m<=4&&(mm<10||mm>=20)?b:c);}

/* local mode: viewer can read tests but cannot write the shared base (opened by link / view access) */
const LKEY="tutor.localAttempts";
function localAll(){try{return JSON.parse(localStorage.getItem(LKEY)||"[]");}catch(e){return [];}}
function localPut(a){if(!a)return;try{const all=localAll().filter(x=>x.id!==a.id);all.push({...a,local:true});localStorage.setItem(LKEY,JSON.stringify(all.slice(-200)));}catch(e){}}
function mergeAttempts(){const loc=localAll();const ids=new Set(loc.map(x=>x.id));S.attempts=S.dbAttempts.filter(x=>!ids.has(x.id)).concat(loc);}
function goLocal(){if(S.local)return;S.local=true;if(S.run&&S.run.a){S.run.a.local=true;localPut(S.run.a);}mergeAttempts();showBanner();
  toast("Ответы сохраняются на этом устройстве. В конце нажми «Отправить результат».");}
function showBanner(){const b=document.getElementById("localBanner");if(b)b.hidden=!S.local;}

/* serialized writes */
let wq=Promise.resolve();
function save(path,data,mode){
  if(path.startsWith("attempts/")&&(S.local||(S.run&&S.run.a&&S.run.a.local))){localPut(S.run&&S.run.a);mergeAttempts();return wq;}
  if(S.local&&path.startsWith("config/")){toast("Менять имена может только владелец страницы.");return wq;}
  wq=wq.then(async()=>{if(!S.db)return;const ref=S.db.doc(path);
    try{await (mode==="set"?ref.set(data):ref.update(data));}
    catch(e){ if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,700+Math.random()*600));try{await (mode==="set"?ref.set(data):ref.update(data));return;}catch(e2){e=e2;}}
      if(e&&e.code==="invalid_argument"&&path.startsWith("attempts/")){goLocal();return;}

/* ============ sanitizer & visuals ============ */
function cleanTree(root){
  root.querySelectorAll("script,iframe,object,embed,foreignObject,link,meta,style,base").forEach(n=>n.remove());
  const all=[root,...root.querySelectorAll("*")];
  for(const el of all){for(const a of [...el.attributes]){const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();
    if(n.startsWith("on")||((n==="href"||n==="xlink:href"||n==="src")&&(v.startsWith("javascript:")||v.startsWith("http"))))el.removeAttribute(a.name);}}
  return root;
}
function insertMarkup(box,markup,kind){
  try{
    if(kind==="svg"){
      const d=new DOMParser().parseFromString(String(markup),"image/svg+xml");const r=d.documentElement;
      if(!r||r.nodeName!=="svg"||d.querySelector("parsererror"))throw new Error("bad svg");
      box.appendChild(document.importNode(cleanTree(r),true));
    }else{
      const d=new DOMParser().parseFromString("<div>"+String(markup)+"</div>","text/html");
      const r=cleanTree(d.body.firstElementChild);while(r.firstChild)box.appendChild(document.importNode(r.firstChild,true)),r.removeChild(r.firstChild);
    }
    return true;
  }catch(e){box.append(h("p",{class:"muted small"},"Рисунок не удалось показать."));return false;}
}
const TOK={ink:"--ink",muted:"--muted",accent:"--accent",pen:"--pen",ok:"--ok",warn:"--warn",soft:"--accent-soft",line:"--line",card:"--card"};
function colorize(attrs){
  for(const k of Object.keys(attrs)){const v=attrs[k];
    if(typeof v==="string"&&/color$/i.test(k)&&TOK[v])attrs[k]=css(TOK[v]);
    else if(v&&typeof v==="object"&&!Array.isArray(v))colorize(v);

}
let jxgInit=false,jxgSeq=0;
function jxgDefaults(){
  if(jxgInit||typeof JXG==="undefined")return;jxgInit=true;

  const O=JXG.Options;

  O.point.strokeColor=ink;O.point.fillColor=ink;O.point.size=2;O.point.highlight=false;
  O.label.strokeColor=ink;O.label.fontSize=16;
  O.text.strokeColor=ink;O.text.fontSize=16;O.text.highlight=false;
  O.line.strokeColor=ink;O.line.strokeWidth=2;
  O.segment&&(O.segment.strokeColor=ink);
  O.polygon.fillColor=acc;O.polygon.fillOpacity=.12;O.polygon.borders.strokeColor=ink;O.polygon.borders.strokeWidth=2;
  O.circle.strokeColor=ink;

function renderJsx(box,v){
  if(typeof JXG==="undefined"){box.append(h("p",{class:"muted small"},"Чертёж не загрузился. Проверьте интернет и обновите страницу."));return null;}
  jxgDefaults();
  const b=v.board||{},bb=Array.isArray(b.boundingbox)&&b.boundingbox.length===4?b.boundingbox:[-6,6,6,-6];
  const id="jxg"+(++jxgSeq);const el=h("div",{id,class:"jxgbox"});
  const ratio=Math.abs((bb[2]-bb[0])/(bb[1]-bb[3]))||1;el.style.aspectRatio=String(ratio);box.append(el);
  let stepped=null,want=0,brd=null,tries=0;
  const apply=()=>{if(!brd||!stepped)return;brd.suspendUpdate();for(const s of stepped)s.o.setAttribute({visible:s.vis&&s.step<=want&&want<s.until});brd.unsuspendUpdate();};
  const init=()=>{
    if(!el.isConnected||!el.clientWidth){if(++tries<120)requestAnimationFrame(init);return;}
    try{brd=JXG.JSXGraph.initBoard(id,{boundingbox:bb,axis:!!b.axis,grid:!!b.grid,keepAspectRatio:!!b.keepAspectRatio,showNavigation:false,showCopyright:false,pan:{enabled:false},zoom:{enabled:false},showFullscreen:false,showScreenshot:false});}
    catch(e){console.warn(e);el.replaceWith(h("p",{class:"muted small"},"Чертёж не удалось построить."));return;}
    const map={};stepped=[];
    const res=p=>typeof p==="string"&&map[p]?map[p]:(Array.isArray(p)?p.map(res):p);
    brd.suspendUpdate();
    for(const e of v.elements||[]){
      try{const attrs=colorize(JSON.parse(JSON.stringify(e.attrs||{})));
        const wantVis=attrs.visible!==false;
        if(e.step||e.until)attrs.visible=false;
        const o=brd.create(e.type,(e.parents||[]).map(res),attrs);
        if(e.id)map[e.id]=o;
        if(e.step||e.until)stepped.push({o,step:e.step||0,until:e.until||Infinity,vis:wantVis});
      }catch(err){console.warn("Элемент чертежа",e,err);}
    }

  };

}
function visual(v,layer){
  const box=h("div",{class:"vis"});if(!v)return{node:box,setLayer(){}};
  let ctl=null;
  if(v.kind==="jsx"){ctl=renderJsx(box,v);}
  else if(v.kind==="svg"||v.kind==="html"){insertMarkup(box,v.kind==="svg"?v.svg:v.html,v.kind);
    ctl={setLayer(n){box.querySelectorAll("[data-step],[data-until]").forEach(x=>{const s=+(x.getAttribute("data-step")||0),u=x.hasAttribute("data-until")?+x.getAttribute("data-until"):Infinity;x.style.display=(s<=n&&n<u)?"":"none";});}};}
  const api={node:box,setLayer(n){ctl&&ctl.setLayer(n);}};
  api.setLayer(layer??0);
  if(v.caption)box.append(h("p",{class:"muted small",html:rich(v.caption),style:"margin-top:6px"}));

/* ============ answers ============ */
function parseNum(s){
  s=String(s??"").trim().replace(/,/g,".").replace(/[−–]/g,"-");
  if(!s)return NaN;
  const mx=s.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mx){const v=+mx[2]+ +mx[3]/+mx[4];return mx[1]?-v:v;}
  s=s.replace(/\s+/g,"");
  const m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(m)return +m[2]?+m[1]/+m[2]:NaN;
  return /^-?\d+(?:\.\d+)?$/.test(s)?Number(s):NaN;
}
function isRight(q,resp){
  if(q.type==="number"){const v=parseNum(resp);if(!isFinite(v))return false;return Math.abs(v-Number(q.answer))<=(q.tolerance??0.001);}
  return String(resp)===String(q.answer);
}
function whyWrong(q,resp){
  if(q.type==="number"){const v=parseNum(resp);
    for(const t of q.typicalWrong||[]){if(isFinite(v)&&Math.abs(v-Number(t.value))<=(t.tolerance??q.tolerance??0.001))return t.why;}
    return q.genericWrong||"Сравни свой ход решения с разбором ниже: найди шаг, где ответ пошёл не туда.";}
  const o=(q.options||[]).find(o=>o.id===resp);return o&&o.why?o.why:"Посмотри разбор ниже, шаг за шагом.";
}
function answerText(q){
  if(q.type==="number")return String(q.answer).replace(".",",")+(q.unit?" "+q.unit:"");
  const o=(q.options||[]).find(o=>o.id===q.answer);return o?o.text:"";
}

function attemptsFor(kid,testId){return S.attempts.filter(a=>a.kid===kid&&(!testId||a.testId===testId)).sort((a,b)=>String(b.startedAt).localeCompare(String(a.startedAt)));}

function testStatus(kid,t){

      b.onclick=()=>{chosen=o.id;grid.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));submit.disabled=false;};grid.append(b);});

function solutionBlock(q,startOpen){

  let shown=0;const more=h("button",{class:"btn soft",type:"button"},"Следующий шаг");const all=h("button",{class:"btn ghost",type:"button"},"Показать все шаги");

      tb.append(body);card.append(h("div",{class:"tbl-wrap"},tb));}
    // rename
    const inp=h("input",{type:"text",value:k.name,id:"name-"+k.id,"aria-label":"Имя"});
    const sv=h("button",{class:"btn ghost",type:"button",style:"min-height:44px"},"Сохранить имя");
    sv.onclick=async()=>{const name=inp.value.trim();if(!name)return;const kids=S.kids.map(x=>x.id===k.id?{...x,name}:x);await save("config/main",{kids},"set");toast("Имя сохранено");};
    card.append(h("details",{style:"margin-top:14px"},h("summary",{class:"muted"},"Изменить имя"),h("div",{class:"namefield"},inp,sv)));
    $view.append(card);
  }
  $view.append(howTo());
}

/* ============ start ============ */
render();boot();
</script>
